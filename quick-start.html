<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UI Framework Quick Start</title>
  <link rel="stylesheet" href="dist/ui-framework.min.css?v=1.17.0">
</head>
<body class="ui-scope">
  <main class="ui-container-lg ui-py-6">
    <div class="ui-card">
      <div class="ui-card-header">
        <h1 class="ui-card-title">UI Framework is ready</h1>
      </div>
      <div class="ui-card-body">
        <div class="ui-alert ui-alert-success ui-mb-4">
          <div class="ui-alert-icon">✓</div>
          <div>
            <div class="ui-alert-title">Installation successful</div>
            <p class="ui-alert-message">The single CSS and JavaScript bundles are loaded.</p>
          </div>
        </div>

        <button class="ui-btn ui-btn-primary"
                onclick="UI.toast.show({type:'success',title:'Working',message:'JavaScript components are available.'})">
          Test toast
        </button>

        <p class="ui-text-muted ui-mt-4 ui-mb-0">
          Both files are just two <span class="ui-code">&lt;link&gt;</span>/<span class="ui-code">&lt;script&gt;</span> tags. Copy them into your own page and start adding <span class="ui-code">ui-*</span> classes.
          Next: <a href="docs/getting-started.html">Getting started</a> · <a href="docs/components.html">Browse components</a>
        </p>
      </div>
    </div>
  </main>
  <script src="dist/ui-framework.min.js?v=1.17.0"></script>
</body>
</html>
