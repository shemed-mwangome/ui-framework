<!doctype html>
<html lang="en" data-ui-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Form workflow · UI Framework Example</title>
  <link rel="stylesheet" href="../../dist/ui-framework.css">
  <style></style>
</head>
<body class="ui-scope">

<header class="ui-navbar ui-justify-between"><a class="ui-navbar-brand" href="../index.html">← UI Framework</a><button class="ui-btn ui-btn-sm ui-btn-outline-secondary" data-ui-theme-toggle>Theme</button></header>
<main class="ui-container-lg ui-py-6">
  <div class="ui-stepper ui-mb-6">
    <div class="ui-step ui-complete"><div class="ui-step-marker">1</div><div class="ui-step-label">Company</div></div>
    <div class="ui-step ui-active"><div class="ui-step-marker">2</div><div class="ui-step-label">Inspection</div></div>
    <div class="ui-step"><div class="ui-step-marker">3</div><div class="ui-step-label">Review</div></div>
    <div class="ui-step"><div class="ui-step-marker">4</div><div class="ui-step-label">Submit</div></div>
  </div>

  <div class="ui-card">
    <div class="ui-card-header"><h1 class="ui-card-title">Schedule compliance inspection</h1><p class="ui-card-subtitle">Complete all required fields before continuing.</p></div>
    <form class="ui-card-body" id="workflowForm">
      <div class="ui-alert ui-alert-info ui-mb-5"><div class="ui-alert-icon">i</div><div><div class="ui-alert-title">Required information</div><p class="ui-alert-message">Fields marked with an asterisk are mandatory.</p></div></div>
      <div class="ui-row ui-g-3">
        <div class="ui-col-12 ui-col-md-6"><label class="ui-label ui-label-required">Premise</label><input class="ui-control" required placeholder="Enter premise name"></div>
        <div class="ui-col-12 ui-col-md-6"><label class="ui-label ui-label-required">Region</label><select class="ui-select" required><option value="">Select region</option><option>Dar es Salaam</option><option>Tanga</option></select></div>
        <div class="ui-col-12 ui-col-md-6"><label class="ui-label ui-label-required">Start date</label><input class="ui-control" type="date" required></div>
        <div class="ui-col-12 ui-col-md-6"><label class="ui-label ui-label-required">End date</label><input class="ui-control" type="date" required></div>
        <div class="ui-col-12"><label class="ui-label">Inspection officers</label><select name="officers" multiple data-ui-multiselect data-display="tags" data-placeholder="Select officers"><option>Asha M.</option><option>Baraka J.</option><option>Neema K.</option><option>Selemani M.</option></select></div>
        <div class="ui-col-12"><label class="ui-label">Notes</label><textarea class="ui-control" placeholder="Add any special instructions"></textarea></div>
        <div class="ui-col-12">
          <div class="ui-upload" data-ui-upload><input type="file" multiple><div><div class="ui-empty-icon">⇧</div><div class="ui-upload-title">Supporting documents</div><div class="ui-upload-help">Drop files here or click to browse</div><div class="ui-upload-preview"></div></div></div>
        </div>
        <div class="ui-col-12"><input id="confirm" class="ui-checkbox ui-checkbox-success" type="checkbox" required><label for="confirm">I confirm that the information is accurate.</label></div>
      </div>
      <div class="ui-d-flex ui-justify-end ui-gap-2 ui-mt-5"><button class="ui-btn ui-btn-outline-secondary" type="button">Save draft</button><button class="ui-btn ui-btn-primary" type="submit">Continue to review</button></div>
    </form>
  </div>
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.getElementById("workflowForm").addEventListener("submit", function (event) {
    event.preventDefault();
    UI.toast.show({type:"success",title:"Form submitted",message:"The inspection schedule is ready for review."});
  });
});
</script>

<script src="../../dist/ui-framework.js"></script>
</body>
</html>
